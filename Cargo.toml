[workspace]
resolver = "2"
members = [
    "contracts/ledgerlens-score",
    "contracts/ledgerlens-aggregator",
    "contracts/mock-amm",
    "contracts/mock-lending",
    "tools/replay",
    "tests/composability",
]

# Force the minimum safe version of crossbeam-epoch to resolve
# RUSTSEC-2026-0204 (invalid pointer dereference). crossbeam-epoch is a
# transitive dependency pulled in via rayon-core → crossbeam-deque.
[workspace.dependencies]
crossbeam-epoch = "0.9.20"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
strip = "symbols"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
